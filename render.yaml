services:
  - type: web
    plan: free
    name: wedding-backend
    runtime: python
    buildCommand: 'bash -lc "cd backend && ./build.sh"'
    startCommand: 'bash -lc "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2"'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2