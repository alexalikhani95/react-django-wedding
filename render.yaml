services:
  - type: web
    plan: free
    name: wedding-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: >
      python -m gunicorn core.asgi:application
      -k uvicorn.workers.UvicornWorker
      --chdir backend
      --bind 0.0.0.0:$PORT
      --workers ${WEB_CONCURRENCY:-2}
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
